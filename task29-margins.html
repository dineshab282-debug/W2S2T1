<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 29 - Margins</title>
  <style>
    .box1 { margin: 10px; }
    .box2 { margin: 20px 40px; }
    .box3 { margin: 30px 50px 70px 90px; }
    .box {
      width: 200px;
      height: 80px;
      background-color: #fde68a;
      border: 1px solid #92400e;
      padding: 10px;
    }
  </style>
</head>
<body>
  <div class="box box1">Margin: 10px</div>
  <div class="box box2">Margin: 20px 40px</div>
  <div class="box box3">Margin: 30px 50px 70px 90px</div>
</body>
</html>
