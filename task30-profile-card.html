<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 30 - Profile Card</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f1f5f9; padding: 30px; }
    .card {
      width: 280px;
      background: white;
      padding: 20px;
      border: 2px solid #cbd5e1;
      margin: 20px auto;
      border-radius: 10px;
      text-align: center;
    }
    h2 { margin: 10px 0 5px; }
    p { color: #475569; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Alice Brown</h2>
    <p>Web Developer</p>
    <p>Creating amazing user experiences with HTML, CSS, and JavaScript.</p>
  </div>
</body>
</html>
