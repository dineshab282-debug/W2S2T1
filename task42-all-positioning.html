<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 42 - All Positioning Types</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
    .nav {
      position: sticky;
      top: 0;
      background: #111827;
      color: white;
      padding: 15px;
    }
    .box {
      width: 180px;
      height: 80px;
      margin: 20px;
      padding: 10px;
      border: 1px solid #999;
      background: #dbeafe;
    }
    .relative { position: relative; left: 30px; }
    .absolute {
      position: absolute;
      right: 20px;
      top: 80px;
      background: #bfdbfe;
    }
    .fixed-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #2563eb;
      color: white;
      padding: 10px 14px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="nav">Sticky Navigation</div>
  <div class="box">Static</div>
  <div class="box relative">Relative</div>
  <div class="box absolute">Absolute</div>
  <div style="height: 1200px;"></div>
  <div class="fixed-btn">Fixed Button</div>
</body>
</html>
