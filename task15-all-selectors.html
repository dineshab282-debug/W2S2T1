<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 15 - All Selector Types</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; padding: 20px; background: #f8fafc; }
    h1, h2, p { color: #1e3a8a; }
    div p { font-style: italic; }
    ul > li { color: #7c3aed; }
    input[type="text"] { border: 2px solid #2563eb; padding: 6px; }
    .card { background: white; padding: 15px; margin: 15px 0; border-radius: 8px; }
    #title { color: #0f766e; }
  </style>
</head>
<body>
  <h1 id="title">All Selector Types Demo</h1>
  <div class="card">
    <p>This paragraph is inside a div.</p>
  </div>
  <ul>
    <li>Child selector item</li>
    <li>Another child selector item</li>
  </ul>
  <input type="text" placeholder="Styled input">
</body>
</html>
