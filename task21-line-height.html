<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 21 - Line Height</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .readable {
      line-height: 1.8;
      font-size: 18px;
      max-width: 600px;
    }
  </style>
</head>
<body>
  <p class="readable">
    This paragraph uses a custom line height to improve readability. Proper spacing between lines makes text easier to scan and more comfortable to read, especially in longer paragraphs and articles.
  </p>
</body>
</html>
