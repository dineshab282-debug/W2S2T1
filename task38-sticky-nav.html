<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 38 - Sticky Navigation</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
    .nav {
      position: sticky;
      top: 0;
      background: #111827;
      color: white;
      padding: 15px 20px;
      display: flex;
      gap: 20px;
    }
    .nav a { color: white; text-decoration: none; }
    .content { padding: 20px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="nav">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
  </div>
  <div class="content">
    <h1>Sticky Navigation Bar</h1>
    <p>Scroll down to see the navigation stay at the top.</p>
    <div style="height: 1200px;"></div>
  </div>
</body>
</html>
