<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 41 - Floating Help Button</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .help-btn {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
  <h1>Floating Help Button</h1>
  <p>Click the help button in the bottom-right corner.</p>
  <div style="height: 1400px;"></div>
  <button class="help-btn">?</button>
</body>
</html>
