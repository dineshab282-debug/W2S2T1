<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 8 - Class Selector</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8fafc;
      padding: 20px;
    }

    .card {
      background-color: white;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 20px;
      margin: 20px 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .card h2 {
      color: #2563eb;
      margin-top: 0;
    }

    .card p {
      color: #475569;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <h1>Class Selector Example</h1>

  <div class="card">
    <h2>Card One</h2>
    <p>This card uses the same class styling as the others.</p>
  </div>

  <div class="card">
    <h2>Card Two</h2>
    <p>Every card with this class gets the same design.</p>
  </div>

  <div class="card">
    <h2>Card Three</h2>
    <p>Class selectors are perfect for reusable styling.</p>
  </div>
</body>
</html>
