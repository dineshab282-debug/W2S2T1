<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 28 - Borders</title>
  <style>
    .solid { border: 3px solid #2563eb; }
    .dashed { border: 3px dashed #dc2626; }
    .dotted { border: 3px dotted #16a34a; }
    .box {
      width: 180px;
      height: 80px;
      margin: 15px;
      padding: 10px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="box solid">Solid Border</div>
  <div class="box dashed">Dashed Border</div>
  <div class="box dotted">Dotted Border</div>
</body>
</html>
