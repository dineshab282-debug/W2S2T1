<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 25 - All Text Formatting</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .demo { line-height: 1.8; text-align: justify; }
    .bold { font-weight: bold; }
    .italic { font-style: italic; }
    .upper { text-transform: uppercase; }
    .lower { text-transform: lowercase; }
    .cap { text-transform: capitalize; }
    a { text-decoration: none; color: #2563eb; }
    a:hover { text-decoration: underline; color: #dc2626; }
  </style>
</head>
<body>
  <h1>Text Formatting Showcase</h1>
  <p class="demo"><span class="bold">Bold</span>, <span class="italic">italic</span>, <span class="upper">uppercase</span>, <span class="lower">LOWERCASE</span>, and <span class="cap">capitalize</span> styles are all shown here.</p>
  <p><a href="#">Sample hyperlink</a></p>
</body>
</html>
