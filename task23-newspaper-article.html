<!DOCTYPE html>

<head>

  <title>Task 23 - Newspaper Article</title>
  <style>
    body { font-family: Times New Roman, serif; padding: 20px; background: #fff; }
    .article {
      max-width: 700px;
      margin: auto;
      text-align: justify;
      line-height: 1.6;
      font-size: 18px;
    }
    h1 { text-align: center; margin-bottom: 15px; }
  </style>
</head>
<body>
  <div class="article">
    <h1>Local News Update</h1>
    <p>
      The city announced a new public library initiative today, aiming to expand access to books, digital resources, and learning programs for residents of all ages. Officials say the project will support education, creativity, and community engagement across neighborhoods.
    </p>
  </div>
