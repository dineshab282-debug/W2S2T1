<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 9 - Universal Selector</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f8fafc;
    }

    h1, p {
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <h1>Universal Selector Example</h1>
  <p>This page removes default margin and padding using the universal selector.</p>
</body>
</html>
