<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 4 - Element Selector</title>
  <style>
    h1, h2 { color: #1d4ed8; }
    p { font-size: 18px; color: #333; line-height: 1.6; }
  </style>
</head>
<body>
  <h1>Element Selector Example</h1>
  <p>This paragraph is styled by an element selector.</p>
  <h2>Subheading</h2>
  <p>All paragraphs share the same style.</p>
</body>
