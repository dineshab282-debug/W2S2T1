<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 33 - Box Shadows</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; }
    .card {
      width: 260px;
      background: white;
      padding: 20px;
      margin: 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="card">This card has a box shadow.</div>
</body>
</html>
