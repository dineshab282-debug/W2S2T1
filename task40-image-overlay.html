<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 40 - Image Overlay</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; }
    .image-container {
      position: relative;
      display: inline-block;
    }
    img {
      width: 300px;
      height: auto;
      border-radius: 10px;
    }
    .overlay-text {
      position: absolute;
      bottom: 20px;
      left: 20px;
      color: white;
      background: rgba(0,0,0,0.6);
      padding: 10px 14px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="image-container">
    <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=600&q=80" alt="Nature landscape">
    <div class="overlay-text">Beautiful Landscape</div>
  </div>
</body>
</html>
