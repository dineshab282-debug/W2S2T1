<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 32 - Rounded Buttons</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 30px; }
    .btn1, .btn2, .btn3 {
      color: white;
      border: none;
      padding: 10px 16px;
      margin: 10px;
      cursor: pointer;
    }
    .btn1 { background: #2563eb; border-radius: 5px; }
    .btn2 { background: #16a34a; border-radius: 20px; }
    .btn3 { background: #dc2626; border-radius: 50px; }
  </style>
</head>
<body>
  <button class="btn1">Small Radius</button>
  <button class="btn2">Medium Radius</button>
  <button class="btn3">Full Radius</button>
</body>
</html>
