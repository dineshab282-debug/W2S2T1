<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 44 - Inline Override</title>
  <style>
    p { color: blue; }
    .text { color: green; }
  </style>
</head>
<body>
  <p class="text" style="color: orange;">This paragraph is styled with inline CSS and overrides the earlier rules.</p>
</body>
</html>
