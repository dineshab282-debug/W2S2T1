<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 39 - Notification Badge</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 40px; }
    .icon {
      position: relative;
      display: inline-block;
      font-size: 40px;
      background: #e5e7eb;
      padding: 15px 20px;
      border-radius: 10px;
    }
    .badge {
      position: absolute;
      top: -8px;
      right: -8px;
      background: #dc2626;
      color: white;
      border-radius: 50%;
      padding: 6px 9px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="icon">🔔<span class="badge">3</span></div>
</body>
</html>
