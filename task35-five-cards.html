<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 35 - Five Cards</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f8fafc; }
    .card {
      width: 180px;
      height: 120px;
      display: inline-block;
      margin: 10px;
      padding: 15px;
      background: white;
      border-radius: 10px;
    }
    .card1 { border: 2px solid #2563eb; box-shadow: 2px 2px 8px rgba(37,99,235,0.3); }
    .card2 { border: 2px dashed #dc2626; box-shadow: 4px 4px 12px rgba(220,38,38,0.3); }
    .card3 { border: 2px dotted #16a34a; box-shadow: 0 0 10px rgba(22,163,74,0.3); }
    .card4 { border: 3px solid #7c3aed; box-shadow: inset 0 0 8px rgba(124,58,237,0.4); }
    .card5 { border: 1px solid #f59e0b; box-shadow: 6px 6px 16px rgba(245,158,11,0.3); }
  </style>
</head>
<body>
  <div class="card card1">Card 1</div>
  <div class="card card2">Card 2</div>
  <div class="card card3">Card 3</div>
  <div class="card card4">Card 4</div>
  <div class="card card5">Card 5</div>
</body>
</html>
